[package]
name = "datafusion_java_bridge"
version = "0.1.0"
edition = "2021"
description = "JNI bridge: Java Arrow -> DataFusion SQL -> Arrow/Parquet"

[lib]
name = "datafusion_java_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
datafusion = "55.1.0"
# Explicit so the Arrow C Data Interface (`ffi` feature) is enabled on the SAME
# single arrow build that DataFusion uses (feature unification, same 59.3.0).
arrow = { version = "59.3.0", features = ["ffi"] }
object_store = { version = "0.13.2", features = ["aws"] }
jni = "0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures = "0.3"